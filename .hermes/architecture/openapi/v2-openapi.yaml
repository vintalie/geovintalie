        '200':
          description: Servidor operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /metrics:
    get:
      tags: [observability]
      summary: Metricas da aplicacao
      responses:
        '200':
          description: Metricas em formato texto/JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'

  # ------------------------------------------------------------------ Auth / Users (C1)
  /auth/me:
    get:
      tags: [auth]
      summary: Obter dados do usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAuthResponse'
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/users:
    get:
      tags: [users]
      summary: Listar usuarios (apenas admin)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, user, public, consumer, retailer, provider, industry]
          description: Filtrar por papel de usuario
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResource'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/users/{id}:
    get:
      tags: [users]
      summary: Obter usuario por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados do usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResource'
