openapi: 3.0.3
info:
  title: GeoVintalie API
  version: 2.0.0
  description: |
    API do GeoVintalie - Versao 2. Novos endpoints para escopos A (O2O/Varejo),
    B (Marketplace de Servicos) e C (Transversal). Endpoints existentes mantidos
    na versao v1 para retrocompatibilidade. Contrato aprovado como pre-condicao
    para qualquer implementacao de features (escopo.md, criterio de aceitacao #1).
  contact:
    name: Arquitetura GeoVintalie
    email: arquitetura@geovintalie.com
  license:
    name: Proprietário
servers:
  - url: http://localhost:8000/api/v2
    description: Servidor de desenvolvimento local
  - url: https://api.geovintalie.com/v2
    description: Servidor de producao
tags:
  - name: auth
    description: Autenticacao e autorizacao (Identidade)
  - name: users
    description: Gestao de usuarios e papeis (Identidade)
  - name: feature-flags
    description: Gerenciamento de feature flags (Transversal)
  - name: service-providers
    description: Cadastro e gestao de prestadores de servico (Escopo B1)
  - name: service-categories
    description: Categorias de servico (Escopo B1, B2)
  - name: service-listings
    description: Anuncios de servicos (Escopo B1, B2)
  - name: service-evaluations
    description: Avaliacoes mutuas cliente <-> prestador (Escopo B5)
  - name: reviews
    description: Avaliacoes publicas de prestadores (Escopo B5)
  - name: service-search
    description: Busca com filtros de servico (Escopo B2)
  - name: product-locator
    description: Localizador de produtos por proximidade (Escopo A1)
  - name: appointments
    description: Agendamentos e chat interno (Escopo B4)
  - name: google-business
    description: Gestao e sincronizacao Google Business Profile (Escopo A2)
  - name: public-properties
    description: Vitrine digital publica (Escopo A3)
  - name: user-consents
    description: Consentimentos LGPD / direito ao esquecimento (Escopo C3)
  - name: observability
    description: Observabilidade - health e metrics (Escopo C2)
paths:
  /auth/me:
    get:
      tags: [auth]
      summary: Obter dados do usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResource'
        '401':
          description: Nao autenticado
  /auth/users:
    get:
      tags: [users]
      summary: Listar usuarios (apenas admin)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, user, public, consumer, retailer, provider, industry]
          description: Filtrar por papel de usuario
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResource'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '403':
          description: Acesso negado
  /auth/users/{id}:
    get:
      tags: [users]
      summary: Obter usuario por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados do usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResource'
        '404':
          description: Usuario nao encontrado
  /feature-flags:
    get:
      tags: [feature-flags]
      summary: Listar todas as feature flags
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de feature flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeatureFlag'
                  meta:
                    $ref: '#/components/schemas/Meta'
  /feature-flags/{name}:
    patch:
      tags: [feature-flags]
      summary: Atualizar uma feature flag (apenas admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagUpdate'
      responses:
        '200':
          description: Flag atualizada
        '403':
          description: Acesso negado
        '404':
          description: Flag nao encontrada
  /service-providers:
    get:
      tags: [service-providers]
      summary: Listar prestadores de servico
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de prestadores
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceProviderResource'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      tags: [service-providers]
      summary: Cadastrar novo prestador de servico
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceProviderCreate'
      responses:
        '201':
          description: Prestador criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceProviderResource'
        '422':
          description: Erro de validacao
  /service-providers/{id}:
    get:
      tags: [service-providers]
      summary: Obter prestador por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados do prestador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceProviderResource'
        '404':
          description: Prestador nao encontrado
    put:
      tags: [service-providers]
      summary: Atualizar prestador
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceProviderUpdate'
      responses:
        '200':
          description: Prestador atualizado
        '404':
          description: Prestador nao encontrado
  /service-providers/{provider_id}/evaluations:
    get:
      tags: [service-evaluations]
      summary: Listar avaliacoes de um prestador (publico)
      parameters:
        - in: path
          name: provider_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de avaliacoes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceEvaluation'
                  meta:
                    $ref: '#/components/schemas/Meta'
  /service-evaluations:
    post:
      tags: [service-evaluations]
      summary: Criar avaliacao mutua cliente <-> prestador
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceEvaluationCreate'
      responses:
        '201':
          description: Avaliacao criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEvaluation'
        '422':
          description: Erro de validacao
  /reviews:
    get:
      tags: [reviews]
      summary: Listar avaliacoes publicas de prestadores
      responses:
        '200':
          description: Lista de avaliacoes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      tags: [reviews]
      summary: Criar avaliacao publica de um prestador
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '201':
          description: Avaliacao criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '422':
          description: Erro de validacao
  /service-providers/{provider_id}/reviews:
    get:
      tags: [reviews]
      summary: Listar avaliacoes publicas de um prestador
      parameters:
        - in: path
          name: provider_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de avaliacoes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  meta:
                    $ref: '#/components/schemas/Meta'
  /service-categories:
    get:
      tags: [service-categories]
      summary: Listar categorias de servico
      parameters:
        - in: query
          name: parent_id
          schema:
            type: integer
          description: ID da categoria pai (para subcategorias)
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceCategoryResource'
  /service-listings:
    get:
      tags: [service-listings]
      summary: Listar anuncios de servicos
      parameters:
        - in: query
          name: provider_id
          schema:
            type: integer
          description: Filtrar por prestador
        - in: query
          name: category_id
          schema:
            type: integer
          description: Filtrar por categoria
        - in: query
          name: is_active
          schema:
            type: boolean
          description: Filtrar por ativo/inativo
      responses:
        '200':
          description: Lista de anuncios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceListingResource'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      tags: [service-listings]
      summary: Criar novo anuncio de servico
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceListingCreate'
      responses:
        '201':
          description: Anuncio criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListingResource'
  /service-listings/{id}:
    get:
      tags: [service-listings]
      summary: Obter anuncio por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados do anuncio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListingResource'
        '404':
          description: Anuncio nao encontrado
  /service-search:
    get:
      tags: [service-search]
      summary: Buscar servicos com filtros (Escopo B2)
      parameters:
        - in: query
          name: category_id
          schema:
            type: integer
          description: ID da categoria
        - in: query
          name: city
          schema:
            type: string
          description: Cidade para filtrar
        - in: query
          name: state
          schema:
            type: string
          description: Estado para filtrar
        - in: query
          name: min_rating
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 5
          description: Avaliacao minima (estrelas)
        - in: query
          name: min_price
          schema:
            type: number
            format: float
          description: Preco minimo
        - in: query
          name: max_price
          schema:
            type: number
            format: float
          description: Preco maximo
        - in: query
          name: q
          schema:
            type: string
          description: Busca por texto (titulo/descricao)
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Limite de resultados
      responses:
        '200':
          description: Resultados da busca
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceListingSearchResource'
                  meta:
                    $ref: '#/components/schemas/Meta'
  /product-locator:
    get:
      tags: [product-locator]
      summary: Localizar produtos por proximidade geografica (Escopo A1)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: lat
          schema:
            type: number
            format: float
          required: true
          description: Latitude do ponto de referencia
        - in: query
          name: lng
          schema:
            type: number
            format: float
          required: true
          description: Longitude do ponto de referencia
        - in: query
          name: radius
          schema:
            type: number
            format: float
            default: 10
          description: Raio de busca em km
        - in: query
          name: product_name
          schema:
            type: string
          description: Nome do produto para buscar
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Limite de resultados
      responses:
        '200':
          description: Produtos proximos encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductLocationResource'
                  meta:
                    $ref: '#/components/schemas/Meta'
  /appointments:
    get:
      tags: [appointments]
      summary: Listar agendamentos (Escopo B4)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de agendamentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      tags: [appointments]
      summary: Criar agendamento (Escopo B4)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
        '201':
          description: Agendamento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '422':
          description: Erro de validacao
  /appointments/{id}:
    get:
      tags: [appointments]
      summary: Obter agendamento por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados do agendamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          description: Agendamento nao encontrado
    put:
      tags: [appointments]
      summary: Atualizar agendamento
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentUpdate'
      responses:
        '200':
          description: Agendamento atualizado
        '404':
          description: Agendamento nao encontrado
    delete:
      tags: [appointments]
      summary: Excluir agendamento
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Agendamento excluido
        '404':
          description: Agendamento nao encontrado
  /agendamentos:
    get:
      tags: [appointments]
      summary: Listar agendamentos (alias, Escopo B4)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de agendamentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      tags: [appointments]
      summary: Criar agendamento (alias, Escopo B4)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
        '201':
          description: Agendamento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
  /agendamentos/{id}:
    get:
      tags: [appointments]
      summary: Obter agendamento por ID (alias)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados do agendamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          description: Agendamento nao encontrado
    patch:
      tags: [appointments]
      summary: Atualizar status do agendamento (alias)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentUpdate'
      responses:
        '200':
          description: Agendamento atualizado
        '404':
          description: Agendamento nao encontrado
    delete:
      tags: [appointments]
      summary: Excluir agendamento (alias)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Agendamento excluido
        '404':
          description: Agendamento nao encontrado
  /conversations:
    get:
      tags: [appointments]
      summary: Listar conversas de chat interno (Escopo B4)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de conversas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      tags: [appointments]
      summary: Criar conversa de chat interno (Escopo B4)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
      responses:
        '201':
          description: Conversa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '422':
          description: Erro de validacao
  /conversations/{id}:
    get:
      tags: [appointments]
      summary: Obter conversa por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados da conversa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          description: Conversa nao encontrada
  /conversations/{id}/messages:
    post:
      tags: [appointments]
      summary: Enviar mensagem em uma conversa (Escopo B4)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: Mensagem enviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Erro de validacao
  /messages:
    get:
      tags: [appointments]
      summary: Listar mensagens (Escopo B4)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de mensagens
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  meta:
                    $ref: '#/components/schemas/Meta'
  /messages/{id}/read:
    post:
      tags: [appointments]
      summary: Marcar mensagem como lida (Escopo B4)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Mensagem marcada como lida
        '404':
          description: Mensagem nao encontrada
  /conversas:
    get:
      tags: [appointments]
      summary: Listar conversas (alias, Escopo B4)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de conversas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      tags: [appointments]
      summary: Criar conversa (alias, Escopo B4)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
      responses:
        '201':
          description: Conversa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
  /conversas/open:
    post:
      tags: [appointments]
      summary: Abrir/obter conversa entre duas partes (alias)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - participant_id
              properties:
                participant_id:
                  type: integer
      responses:
        '200':
          description: Conversa aberta/obtida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
  /conversas/{id}:
    get:
      tags: [appointments]
      summary: Obter conversa por ID (alias)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados da conversa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          description: Conversa nao encontrada
  /conversas/{id}/mensagens:
    get:
      tags: [appointments]
      summary: Listar mensagens de uma conversa (alias)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de mensagens
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      tags: [appointments]
      summary: Enviar mensagem (alias)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: Mensagem enviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /google-business/callback:
    get:
      tags: [google-business]
      summary: Callback OAuth 2.0 do Google Business Profile (chamado pelo navegador apos consentimento)
      parameters:
        - in: query
          name: code
          schema:
            type: string
          description: Codigo de autorizacao do Google
        - in: query
          name: state
          schema:
            type: string
          description: Estado assinado que identifica o usuario
      responses:
        '200':
          description: OAuth concluido com sucesso
        '400':
          description: Erro no fluxo OAuth
        '422':
          description: Parametros ausentes (esperado quando chamado sem parametros)
  /google-business/redirect:
    get:
      tags: [google-business]
      summary: Iniciar autorizacao OAuth (exige JWT para identificar o usuario)
      security:
        - bearerAuth: []
      responses:
        '302':
          description: Redirecionamento para consentimento do Google
        '401':
          description: Nao autenticado
  /google-business/accounts:
    get:
      tags: [google-business]
      summary: Listar contas do Google Business Profile vinculadas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de contas
  /google-business/accounts/{account}/locations:
    get:
      tags: [google-business]
      summary: Listar locais de uma conta do Google Business Profile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: account
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de locais
  /google-business/accounts/{account}/locations/{location}:
    get:
      tags: [google-business]
      summary: Sincronizar um local específico do Google Business Profile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: account
          required: true
          schema:
            type: string
        - in: path
          name: location
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Local sincronizado
        '404':
          description: Local nao encontrado
  /google-business/disconnect:
    delete:
      tags: [google-business]
      summary: Desconectar conta do Google Business Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conta desconectada
        '404':
          description: Vinculacao nao encontrada
  /public/properties:
    get:
      tags: [public-properties]
      summary: Listar propriedades da vitrine digital publica (Escopo A3)
      responses:
        '200':
          description: Lista de propriedades publicas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PropertyResource'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '500':
          description: Erro interno (PublicPropertyController ausente - ver NC-03)
  /public/properties/{id}:
    get:
      tags: [public-properties]
      summary: Obter propriedade da vitrine digital publica por ID (Escopo A3)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados da propriedade publica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResource'
        '404':
          description: Propriedade nao encontrada
        '500':
          description: Erro interno (PublicPropertyController ausente - ver NC-03)
  /user-consents:
    get:
      tags: [user-consents]
      summary: Listar consentimentos do usuario autenticado (LGPD, Escopo C3)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de consentimentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserConsent'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      tags: [user-consents]
      summary: Registrar consentimento (LGPD, Escopo C3)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserConsentCreate'
      responses:
        '201':
          description: Consentimento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserConsent'
        '422':
          description: Erro de validacao
  /user-consents/{purpose}:
    delete:
      tags: [user-consents]
      summary: Retirar consentimento por finalidade (LGPD, Escopo C3)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: purpose
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consentimento retirado
        '404':
          description: Consentimento nao encontrado
  /user-consents/export:
    get:
      tags: [user-consents]
      summary: Exportar dados do usuario (direito ao esquecimento / portabilidade, Escopo C3)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados exportados
  /user-consents/account:
    delete:
      tags: [user-consents]
      summary: Excluir conta do usuario (direito ao esquecimento, Escopo C3)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conta excluida
        '404':
          description: Usuario nao encontrado
  /health:
    get:
      tags: [observability]
      summary: Health check da API (Escopo C2)
      responses:
        '200':
          description: API saudavel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /metrics:
    get:
      tags: [observability]
      summary: Metricas da API (Escopo C2)
      responses:
        '200':
          description: Metricas expostas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
